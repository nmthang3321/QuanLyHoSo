name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify solution
        shell: pwsh
        run: ./tests/Scripts/run-all.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers, customer PDF, and checksums
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QuanLyHoSo ${{ steps.version.outputs.tag }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Bộ cài QuanLyHoSo dành cho Windows 64-bit, kèm tài liệu khách hàng và mã SHA-256.

            - Cài Server trước, sau đó cài Client trên các máy trạm.
            - Server và Client phải sử dụng cùng phiên bản.
            - Bộ cài đã kèm .NET Runtime.
            - Khi nâng cấp, sao lưu dữ liệu trước và cập nhật Server cùng toàn bộ Client.
            - Kiểm tra mã SHA-256 của hai bộ cài và PDF theo file SHA256.txt.
          files: |
            artifacts/installer/QuanLyHoSo-Server-Setup-${{ steps.version.outputs.value }}-win-x64.exe
            artifacts/installer/QuanLyHoSo-Client-Setup-${{ steps.version.outputs.value }}-win-x64.exe
            artifacts/installer/QuanLyHoSo_TaiLieu_KhachHang_${{ steps.version.outputs.value }}.pdf
            artifacts/installer/SHA256.txt
