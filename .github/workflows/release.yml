name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify solution
        shell: pwsh
        run: ./tests/Scripts/run-all.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers and checksums
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QuanLyHoSo ${{ steps.version.outputs.tag }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Bản phát hành QuanLyHoSo dành cho Windows 64-bit.

            - Dùng file Setup để cài mới hoặc nâng cấp thủ công Client/Server.
            - Các gói ZIP được ứng dụng sử dụng cho chức năng cập nhật tự động.
            - Bộ cài đã kèm .NET Runtime.
            - Không kèm cơ sở dữ liệu hay dữ liệu hồ sơ.
            - Kiểm tra mã SHA-256 theo file SHA256.txt.
          files: |
            artifacts/installer/QuanLyHoSo-Server-Setup-${{ steps.version.outputs.value }}-win-x64.exe
            artifacts/installer/QuanLyHoSo-Client-Setup-${{ steps.version.outputs.value }}-win-x64.exe
            artifacts/installer/QuanLyHoSo-Client-${{ steps.version.outputs.value }}.zip
            artifacts/installer/QuanLyHoSo-Server-${{ steps.version.outputs.value }}.zip
            artifacts/installer/SHA256.txt
